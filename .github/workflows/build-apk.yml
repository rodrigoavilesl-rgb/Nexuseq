name: Build APK

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NexusEQ.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexusEQ-apk
          path: NexusEQ.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NEXUS.EQ APK (última compilación)
          prerelease: true
          files: NexusEQ.apk
          body: "Debug APK firmado con la clave de depuración. Descarga NexusEQ.apk e instálalo."
