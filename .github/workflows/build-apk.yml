name: Build APK

# Se ejecuta en cada push a main o a ramas claude/** y a mano desde la pestaña Actions (botón "Run workflow").
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el release de prueba

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NexusEQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El repo no trae gradlew: se instala Gradle 8.7 (el que pide el proyecto).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Tests unitarios
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NexusEQ-debug-apk
          path: NexusEQ/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica el APK como release "test-latest" para bajarlo directo (sin zip) desde el celular.
      - name: Publicar APK en el release test-latest
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NexusEQ.apk
          gh release view test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create test-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "NEXUS.EQ build de prueba (última)" \
              --notes "APK de depuración con firma fija. Descarga NexusEQ.apk e instálalo encima de la versión anterior."
          gh release upload test-latest NexusEQ.apk --repo "$GITHUB_REPOSITORY" --clobber
