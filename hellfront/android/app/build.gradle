plugins { id 'com.android.application' }

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }

android {
    namespace 'com.hellfront.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hellfront.game'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4'
    }
    signingConfigs {
        main {
            storeFile file('../hellfront.keystore')
            storePassword 'hellfront'
            keyAlias 'hellfront'
            keyPassword 'hellfront'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.main
            minifyEnabled false
        }
        debug { signingConfig signingConfigs.main }
    }
}

// Una sola fuente de verdad: el juego vive en ../../index.html
tasks.register('copyGame', Copy) {
    from('../../index.html')
    from('../../music') { into 'music' }
    into('src/main/assets')
}
preBuild.dependsOn 'copyGame'
