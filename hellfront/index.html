<div id="wrap"><canvas id="c"></canvas></div>
<div id="vig"></div>
<script>
'use strict';
/* =========================================================
   HELLFRONT : ZONA ROJA
   Run-and-gun vertical: tanques, rescates, granadas y gore
   ========================================================= */
const W=640,H=360,LH=5600;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const dc=document.createElement('canvas');dc.width=W;dc.height=LH;const dctx=dc.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();

/* ---------- util ---------- */
const R=Math.random,TAU=Math.PI*2,PI=Math.PI;
const rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*clamp(t,0,1);
const hash=(x,y)=>{let h=Math.imul(x*374761393+y*668265263,1274126177);h=(h^h>>>13)>>>0;return(h%1000)/1000};

/* ---------- audio (sintesis por capas: chasquido + estampido + cola con reverb + paneo) ---------- */
let AC=null,master=null,revIn=null,noiseBuf=null,muted=false;const sndT={};
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=7;comp.attack.value=.003;comp.release.value=.2;
    master=AC.createGain();master.gain.value=.85;master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
    const len=Math.floor(AC.sampleRate*1.7),ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const ch=ir.getChannelData(c);for(let i=0;i<len;i++)ch[i]=(R()*2-1)*Math.pow(1-i/len,3.4)}
    const conv=AC.createConvolver();conv.buffer=ir;revIn=AC.createGain();const rg=AC.createGain();rg.gain.value=.55;revIn.connect(conv);conv.connect(rg);rg.connect(master);
    musInit();loadTracks();
  }catch(e){AC=null}
}
function bus(o){
  const g=AC.createGain();let out=g;
  if(o.pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);g.connect(p);out=p}
  out.connect(master);
  if(o.rev){const s=AC.createGain();s.gain.value=o.rev;out.connect(s);s.connect(revIn)}

function readInput(p){

  if(p.id===0){

  if(d.arm&&(type==='b'||type==='shot'||type==='fire'))dmg*=d.arm;
  e.hp-=dmg;e.hit=.07;e.aggro=true;
  const armored=e.kind==='tank'||e.kind==='turret'||e.kind==='boss';
  if(armored){spark(e.x+Math.cos(a+PI)*e.r*.6,e.y+Math.sin(a+PI)*e.r*.6,2);sfx('ping',e.x)}
  else{
    if(type==='fire'){e.burn=2.6}
    else{bloodSpray(e.x,e.y,a,type==='shot'?4:ri(4,8),170,.45);sfx('hit',e.x)}
  }
  if(e.hp<=0)killEnemy(e,-e.hp,a,type,src);
}

/* ---------- shooting ---------- */
function mkBullet(x,y,a,s,o){bullets.push(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dmg:10,own:0,r:2,t:'b',pierce:false,hits:null},o))}
function playerShoot(p,a){
  const w=WPN[p.wpn],mx=p.x+Math.cos(a)*11,my=p.y+Math.sin(a)*11;
  for(let i=0;i<w.pel;i++){
    const aa=a+(R()-.5)*w.spread*2,s=w.spd*(w.pel>1?rnd(.8,1.1):1);
    mkBullet(mx,my,aa,s,{life:w.life*(w.pel>1?rnd(.7,1.1):1),dmg:w.dmg,r:w.fire?5:w.rocket?3:2,t:w.fire?'fire':w.rocket?'rocket':p.wpn===2?'shot':'b',pierce:!!w.fire,pl:p,hits:w.fire?new Set():null,er:44,ed:75});
  }
  addPart({x:mx,y:my,z:5,vx:0,vy:0,vz:0,life:.05,max:.05,type:'flash',r:w.fire?9:7,c:w.col});
  if(!w.fire){const ca=a+PI/2+rnd(-.4,.4);addPart({x:p.x,y:p.y,z:6,vx:Math.cos(ca)*rnd(30,70),vy:Math.sin(ca)*rnd(30,70),vz:rnd(40,80),life:.5,max:.5,type:'shell'})}
  if(p.wpn===2||w.rocket){p.x-=Math.cos(a)*2;p.y-=Math.sin(a)*2;shake=Math.max(shake,2.5)}
  sfx(w.snd,p.x);
  if(p.wpn===2)ono(mx+Math.cos(a)*14,my+Math.sin(a)*14,'BANG!','#f0c040',16);else if(w.fire&&R()<.04)ono(mx+Math.cos(a)*20,my+Math.sin(a)*20,'FWOOSH!','#e08a28',15);else if(p.wpn===1&&R()<.05)ono(mx+Math.cos(a)*14,my+Math.sin(a)*14,'RATATA!','#f0c040',12);
}
function throwNade(p,inp){
  if(p.nades<=0||p.ncd>0)return;p.nades--;p.ncd=.45;
  const d=clamp(inp.mdist||120,50,190),T=.8;
  nades.push({x:p.x,y:p.y,vx:Math.cos(inp.aim)*d/T,vy:Math.sin(inp.aim)*d/T,z:2,vz:200,fuse:.8,pl:p,t:0});sfx('nade');
}

/* ---------- update: players / vehicles ---------- */
function toggleVehicle(p){
  if(p.veh){const v=p.veh;v.pilot=null;p.veh=null;
    for(let i=0;i<8;i++){const a=v.ang+PI/2+i*.8,x=v.x+Math.cos(a)*22,y=v.y+Math.sin(a)*22;if(!hitWall(x,y,6)){p.x=x;p.y=y;break}}
    p.inv=.5;return}
  let best=null,bd=36;for(const v of vehicles){if(!v.pilot&&!v.dead){const d=dist(p,v);if(d<bd){bd=d;best=v}}}
  if(best){best.pilot=p;p.veh=best;addBanner('TANQUE EN LÍNEA — ATROPELLA TODO','#0ff',1.6);sfx('pick')}
}
function updPlayer(p,dt){
  const inp=readInput(p);
  if(!p.alive){if(p.lives>0){p.respawn-=dt;if(p.respawn<=0)spawnPlayer(p)}return}
  p.cd-=dt;p.ncd-=dt;p.inv-=dt;
  if(inp.use&&!p.useL)toggleVehicle(p);p.useL=inp.use;
  p.aim=inp.aim;
  if(p.veh){driveVehicle(p,inp,dt);return}
  let mx=inp.mx,my=inp.my;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
  const sp=90*(inWater(p)?.55:1)*(inp.fire?.88:1);
  if(move(p,mx*sp*dt,my*sp*dt,5))p.walk+=l*sp*dt*.18;
  p.x=clamp(p.x,8,W-8);p.y=clamp(p.y,camY+10,camY+H-8);
  const w=WPN[p.wpn];
  if(inp.fire&&p.cd<=0){
    if(p.wpn>0&&p.ammo[p.wpn]<=0){p.wpn=0;addText(p.x,p.y-12,'SIN MUNICIÓN','#f55')}
    else{p.cd=w.rate;if(p.wpn>0)p.ammo[p.wpn]--;playerShoot(p,p.aim);if(p.wpn>0&&p.ammo[p.wpn]<=0)p.wpn=0}
  }
  if(inp.nade)throwNade(p,inp);
  // pickups
  for(const k of pickups){
    if(k.got)continue;
    if(Math.hypot(k.x-p.x,k.y-p.y)<12){
      k.got=true;sfx('pick');
      if(k.k==='hp'){p.hp=Math.min(p.max,p.hp+45);addText(k.x,k.y,'+SALUD','#4f8')}
      else if(k.k==='gren'){p.nades=Math.min(9,p.nades+3);addText(k.x,k.y,'+GRANADAS','#fa0')}
      else if(k.k==='wpn'){p.wpn=k.v;p.ammo[k.v]=Math.min(WMAX[k.v],p.ammo[k.v]+WAMMO[k.v]);addText(k.x,k.y,WPN[k.v].n,'#fff');addBanner(WPN[k.v].n+' ADQUIRIDA',WPN[k.v].col,1)}
      else if(k.k==='pow'){rescued++;score+=1000;p.hp=Math.min(p.max,p.hp+30);p.nades=Math.min(9,p.nades+2);addText(k.x,k.y,'RESCATADO +1000','#0ff');addBanner('UNO DE LOS NUESTROS','#0ff',1.3)}
    }
  }
}
function driveVehicle(p,inp,dt){
  const v=p.veh;v.cd-=dt;v.cd2-=dt;
  let mx=inp.mx,my=inp.my;const l=Math.hypot(mx,my);let sp=0;
  if(l>.2){
    const ta=Math.atan2(my,mx),d=angDiff(ta,v.ang);
    v.ang+=clamp(d,-3.2*dt,3.2*dt);
    sp=80*Math.max(0,Math.cos(d))*(inWater(v)?.6:1);
    const dx=Math.cos(v.ang)*sp*dt,dy=Math.sin(v.ang)*sp*dt;
    if(!hitWall(v.x+dx,v.y,11))v.x+=dx;if(!hitWall(v.x,v.y+dy,11))v.y+=dy;
  }
  v.spd=sp;v.x=clamp(v.x,14,W-14);v.y=clamp(v.y,camY+14,camY+H-12);
  if(sp>12)for(const e of enemies){if(e.dead||e.dying||e.kind==='tank'||e.kind==='turret'||e.kind==='boss')continue;
    if(Math.hypot(e.x-v.x,e.y-v.y)<v.r+e.r)hurtEnemy(e,999,v.ang,'crush',p)}
  v.tang=lerpAng(v.tang,inp.aim,dt*14);
  p.x=v.x;p.y=v.y;
  if(inp.fire&&v.cd<=0){v.cd=.075;const a=v.tang+rnd(-.05,.05);mkBullet(v.x+Math.cos(a)*16,v.y+Math.sin(a)*16,a,520,{life:.8,dmg:10,pl:p,t:'b'});sfx('smg',v.x);
    addPart({x:v.x+Math.cos(a)*16,y:v.y+Math.sin(a)*16,z:5,vx:0,vy:0,vz:0,life:.04,max:.04,type:'flash',r:6,c:'#ff0'})}
  if(inp.nade&&v.cd2<=0){v.cd2=.85;const a=v.tang,dd=clamp(inp.mdist||200,60,260);
    mkBullet(v.x+Math.cos(a)*20,v.y+Math.sin(a)*20,a,360,{life:dd/360,dmg:0,r:3,t:'rocket',pl:p,er:46,ed:95});sfx('cannon',v.x);shake=Math.max(shake,4);
    v.x-=Math.cos(a)*2;v.y-=Math.sin(a)*2}
  for(const k of pickups){if(!k.got&&k.k==='hp'&&Math.hypot(k.x-v.x,k.y-v.y)<16){k.got=true;v.hp=Math.min(v.max,v.hp+80);addText(k.x,k.y,'+BLINDAJE','#4f8');sfx('pick')}}
}

/* ---------- update: enemies ---------- */
function nearestTarget(x,y){
  let b=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}
  return b?{p:b,d:bd,a:Math.atan2(b.y-y,b.x-x)}:null;
}
const ESPD=.68,EDMG=.75;
function eShoot(e,a,spd,dmg,t='e',life=3){
  if(t!=='eshell'&&bullets.filter(b=>b.own).length>26)return;
  spd*=ESPD;dmg*=EDMG;sfx(t==='eshell'?'cannon':'efire',e.x);mkBullet(e.x+Math.cos(a)*(e.r+3),e.y+Math.sin(a)*(e.r+3),a,spd,{own:1,r:(t==='eshell'||t==='fball')?3.6:2,dmg,t,life,er:34,ed:34})}
function updEnemy(e,dt){
  e.hit-=dt;
  if(e.dying){updBossDying(e,dt);return}
  if(!e.aggro){if(e.y>camY-10&&e.y<camY+H+20&&e.kind!=='boss')e.aggro=true;else if(e.kind!=='boss')return}
  if(e.burn>0){
    e.burn-=dt;e.hp-=9*dt;if(R()<dt*30)addPart({x:e.x+rnd(-4,4),y:e.y+rnd(-4,4),z:rnd(2,8),vx:rnd(-10,10),vy:rnd(-10,10),vz:rnd(40,90),life:.4,max:.4,type:'fire',s:rnd(3,5)});
    if(e.hp<=0){killEnemy(e,0,0,'fire');return}
    if(e.kind==='grunt'||e.kind==='runner'){e.mt-=dt;if(e.mt<=0){e.mt=.25;e.ang=rnd(0,TAU)}move(e,Math.cos(e.ang)*70*dt,Math.sin(e.ang)*70*dt,e.r);e.walk+=dt*12;return}
  }
  const T=nearestTarget(e.x,e.y);if(!T)return;
  const a=T.a,d=T.d;
  switch(e.kind){
    case'grunt':{
      e.face=lerpAng(e.face,a,dt*10);
      let mx,my;
      if(d>170){mx=Math.cos(a);my=Math.sin(a)}else if(d<90){mx=-Math.cos(a);my=-Math.sin(a)}else{mx=-Math.sin(a)*e.dir;my=Math.cos(a)*e.dir}
      e.mt-=dt;if(e.mt<=0){e.mt=rnd(1,2.5);e.dir*=-1}
      if(!move(e,mx*e.sp*dt,my*e.sp*dt,e.r))e.dir*=-1;e.walk+=dt*9;
      e.cd-=dt;if(e.cd<=0&&d<290){eShoot(e,a+rnd(-.2,.2),150,8);if(--e.burst>0)e.cd=.22;else{e.cd=rnd(2.4,4);e.burst=ri(1,3)}}
      break}
    case'runner':{
      e.face=lerpAng(e.face,a,dt*14);
      if(!move(e,Math.cos(a)*e.sp*dt,Math.sin(a)*e.sp*dt,e.r)){move(e,Math.cos(a+1.2)*e.sp*dt,Math.sin(a+1.2)*e.sp*dt,e.r)}
      e.walk+=dt*16;e.cd-=dt;
      const tr=T.p.veh?14:6;
      if(d<e.r+tr+3&&e.cd<=0){e.cd=.7;hurtPlayer(T.p,9,a,'melee');sfx('hit')}
      break}
    case'heavy':{
      e.face=lerpAng(e.face,a,dt*5);
      if(d>140)move(e,Math.cos(a)*e.sp*dt,Math.sin(a)*e.sp*dt,e.r);e.walk+=dt*5;
      e.cd-=dt;if(e.cd<=0&&d<300){eShoot(e,a+rnd(-.2,.2),170,7);e.burst--;if(e.burst>0)e.cd=.16;else{e.cd=rnd(2.8,4);e.burst=ri(4,6)}}
      break}
    case'turret':{
      e.face=lerpAng(e.face,a,dt*4);e.cd-=dt;
      if(d<320&&e.cd<=0){eShoot(e,e.face+rnd(-.1,.1),190,9);if(--e.burst>0)e.cd=.2;else{e.cd=rnd(2.8,3.8);e.burst=2}}
      break}
    case'tank':{
      e.tang=lerpAng(e.tang,a,dt*3);
      if(d>190){e.ang=lerpAng(e.ang,a,dt*2);move(e,Math.cos(e.ang)*e.sp*dt,Math.sin(e.ang)*e.sp*dt,13)}
      else if(d<110){e.ang=lerpAng(e.ang,a+PI,dt*2);move(e,Math.cos(e.ang)*e.sp*dt*.8,Math.sin(e.ang)*e.sp*dt*.8,13)}
      e.a1-=dt;if(e.a1<=0&&d<340){e.a1=rnd(3.8,5);eShoot(e,e.tang,200,0,'eshell',Math.min(d,300)/(200*ESPD))}
      e.a2-=dt;if(e.a2<=0&&d<300){e.a2=.18;e.burst--;eShoot(e,e.tang+rnd(-.18,.18),170,6);if(e.burst<=-4){e.burst=5;e.a2=rnd(2.4,3.4)}}
      break}
    case'imp':{
      e.face=lerpAng(e.face,a,dt*8);e.walk+=dt*10;
      let mx,my;if(d>200){mx=Math.cos(a);my=Math.sin(a)}else if(d<110){mx=-Math.cos(a);my=-Math.sin(a)}else{mx=-Math.sin(a)*e.dir;my=Math.cos(a)*e.dir}
      e.mt-=dt;if(e.mt<=0){e.mt=rnd(.8,2);e.dir*=-1}
      e.x=clamp(e.x+mx*e.sp*dt,10,W-10);e.y+=my*e.sp*dt;
      e.cd-=dt;if(e.cd<=0&&d<300){eShoot(e,a+rnd(-.12,.12),125,11,'fball',3.4);e.cd=rnd(2.8,4.2)}
      break}
    case'hound':{
      e.face=lerpAng(e.face,a,dt*12);e.walk+=dt*18;e.mt-=dt;
      if(e.mt<=0){e.mt=rnd(1.8,3);e.lunge=.45}
      let sp=e.sp;if(e.lunge>0){e.lunge-=dt;sp*=2.1}
      const ang=a+(d>80?Math.sin(tAll*7+e.t)*.5:0);
      if(!move(e,Math.cos(ang)*sp*dt,Math.sin(ang)*sp*dt,e.r))move(e,Math.cos(a+1.3)*sp*dt,Math.sin(a+1.3)*sp*dt,e.r);
      e.cd-=dt;const tr=T.p.veh?14:6;if(d<e.r+tr+4&&e.cd<=0){e.cd=.9;hurtPlayer(T.p,10,a,'melee');sfx('hit',e.x)}
      break}
    case'boss':updBoss(e,dt,T);break;
  }
}
function updBoss(e,dt,T){
  if(!e.aggro){if(camY<90){e.aggro=true;bossActive=true;addBanner('EL CARNICERO MK-IV — JEFE FINAL','#f0f',2.6);radio('BASE HALCÓN','Es la máquina de la Orden, conectada al Portal Mayor. ¡Derríbala y cierra esa puerta!');sfx('alarm');shake=8}else return}
  e.t+=dt;const f=e.hp/e.max;
  e.x=320+Math.sin(e.t*(f<.3?.95:.55))*200;e.y=130+Math.sin(e.t*1.3)*16;
  e.face=lerpAng(e.face,T.a,dt*3);
  e.a1-=dt;e.a2-=dt;e.a3-=dt;
  if(e.a1<=0){e.a1=f<.5?2:2.8;const n=f<.5?12:8,off=e.t*2;for(let i=0;i<n;i++)eShoot(e,off+i/n*TAU,115,9)}
  if(e.a2<=0){e.a2=f<.5?3.6:4.8;for(const p of players){if(!p.alive)continue;const a=Math.atan2(p.y-e.y,p.x-e.x);for(const o of[-.22,0,.22])eShoot(e,a+o,165,0,'eshell',Math.hypot(p.x-e.x,p.y-e.y)/(165*ESPD))}}
  if(e.a3<=0&&f<.7){e.a3=9;if(enemies.filter(q=>!q.dead).length<16){for(let i=0;i<3;i++)addEnemy(R()<.3?'heavy':'runner',rnd(40,600),camY-10).aggro=true}}
  if(Math.floor(e.t*6)%7===0&&R()<dt*3)eShoot(e,e.face+rnd(-.16,.16),180,8);
}
function updBossDying(e,dt){
  e.dyT+=dt;
  if(R()<dt*14){const x=e.x+rnd(-30,30),y=e.y+rnd(-24,24);explode(x,y,36,0,true);gibBurst(x,y,{kind:'heavy',r:9,body:'#555'},0,0,1.3,'#555')}
  shake=Math.max(shake,6);
  if(e.dyT>3){
    ono(e.x,e.y-20,'KA-BOOOM!','#f0c040',34);explode(e.x,e.y,150,0,true);for(let i=0;i<4;i++)gibBurst(e.x+rnd(-30,30),e.y+rnd(-20,20),{kind:'heavy',r:9,body:'#664'},0,0,1.8,'#664');
    e.dead=true;kills++;score+=EK.boss.sc*combo.mult;winT=3;
  }
}

/* ---------- update: bullets / nades / misc ---------- */
function bulletEnd(b){
  if(b.t==='rocket')explode(b.x,b.y,b.er,b.ed,false,b.pl);
  else if(b.t==='eshell')explode(b.x,b.y,b.er,b.ed,true);
}
function updBullets(dt){
  for(const b of bullets){
    const sp=Math.hypot(b.vx,b.vy),steps=Math.max(1,Math.ceil(sp*dt/4)),sdt=dt/steps;
    for(let s=0;s<steps&&!b.dead;s++){
      b.x+=b.vx*sdt;b.y+=b.vy*sdt;b.life-=sdt;
      if(b.x<-10||b.x>W+10||b.y<camY-40||b.y>camY+H+40){b.dead=true;break}
      if(b.t==='rocket'&&R()<.5)addPart({x:b.x,y:b.y,z:3,vx:rnd(-8,8),vy:rnd(-8,8),vz:10,life:.5,max:.5,type:'smoke',s:rnd(2,4)});
      if(b.t==='fire'&&R()<.35)addPart({x:b.x,y:b.y,z:rnd(1,5),vx:rnd(-10,10),vy:rnd(-10,10),vz:rnd(10,40),life:.3,max:.3,type:'fire',s:rnd(3,6)});
      const w=hitWall(b.x,b.y,1);
      if(w){
        if(w.t==='crate'){w.hp-=b.dmg||20;if(w.hp<=0)breakCrate(w)}
        spark(b.x,b.y,3);if(b.t==='fire'){if(R()<.3)b.dead=true}else{bulletEnd(b);b.dead=true}break;
      }
      if(b.life<=0){bulletEnd(b);b.dead=true;break}
      for(const br of barrels){if(Math.hypot(br.x-b.x,br.y-b.y)<br.r+b.r){if(b.t==='fire'||b.own===0||true){if(b.t==='rocket'){bulletEnd(b)}else hurtBarrel(br,b.dmg||20);if(b.t!=='fire')b.dead=true}break}}
      if(b.dead)break;
      if(b.own===0){
        for(const e of enemies){
          if(e.dead||e.dying)continue;
          if(b.hits&&b.hits.has(e))continue;
          if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
            if(b.t==='rocket'){bulletEnd(b);b.dead=true;break}
            if(b.hits)b.hits.add(e);
            hurtEnemy(e,b.dmg,Math.atan2(b.vy,b.vx),b.t,b.pl);
            if(!b.pierce){b.dead=true;break}
          }
        }
        if(!b.dead)for(const po of portals){
          if(po.dead||po.major)continue;
          if(Math.hypot(po.x-b.x,po.y-b.y)<po.r+b.r){
            if(b.t==='rocket'){bulletEnd(b);b.dead=true;break}
            if(b.hits&&b.hits.has(po))continue;if(b.hits)b.hits.add(po);
            hurtPortal(po,b.dmg||20,b.vx,b.vy);if(!b.pierce)b.dead=true;break;
          }
        }
      }else{
        for(const p of players){
          if(!p.alive)continue;
          const rr=p.veh?13:p.r;
          if(Math.hypot(p.x-b.x,p.y-b.y)<rr+b.r){
            if(b.t==='eshell'){bulletEnd(b);b.dead=true;break}
            if(p.inv<=0||p.veh){if(p.veh)hurtVehicle(p.veh,b.dmg*.7);else hurtPlayer(p,b.dmg,Math.atan2(b.vy,b.vx),'b')}
            b.dead=true;break;
          }
        }
        if(!b.dead)for(const v of vehicles){if(!v.pilot&&!v.dead&&Math.hypot(v.x-b.x,v.y-b.y)<v.r){spark(b.x,b.y,2);b.dead=true;break}}
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
}
function updNades(dt){
  for(const n of nades){
    n.t+=dt;n.vz-=520*dt;n.z+=n.vz*dt;
    const nx=n.x+n.vx*dt,ny=n.y+n.vy*dt;
    if(hitWall(nx,n.y,3))n.vx*=-.4;else n.x=nx;
    if(hitWall(n.x,ny,3))n.vy*=-.4;else n.y=ny;
    if(n.z<=0){n.z=0;n.vz=Math.abs(n.vz)*.3;n.vx*=.55;n.vy*=.55}
    n.fuse-=dt;
    if(n.fuse<=0){n.dead=true;explode(n.x,n.y,58,115,false,n.pl)}
  }
  nades=nades.filter(n=>!n.dead);
}
function updParts(dt){
  for(const p of parts){
    p.life-=dt;if(p.life<=0){p.dead=true;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='blood'){p.vz-=520*dt;p.z+=p.vz*dt;if(p.z<=0){p.dead=true;stampBlood(p.x,p.y,p.s*rnd(.8,1.6),.6)}}
    else if(p.type==='shell'){p.vz-=520*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=Math.abs(p.vz)*.4;p.vx*=.5;p.vy*=.5}}
    else if(p.type==='fire'||p.type==='smoke'){p.z+=(p.vz||20)*dt;p.vx*=.96;p.vy*=.96}
    else if(p.type==='spark'){p.vz-=300*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz*=-.3}}
  }
  parts=parts.filter(p=>!p.dead);
  for(const g of gibs){
    g.life-=dt;g.vz-=520*dt;g.z+=g.vz*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.vr*dt;
    if(g.z>3&&R()<dt*20&&g.k!=='metal')bloodSpray(g.x,g.y,0,1,30,PI);
    if(g.z<=0){
      g.z=0;g.vz=Math.abs(g.vz)*.35;g.vx*=.6;g.vy*=.6;g.vr*=.6;
      if(g.k!=='metal')stampBlood(g.x,g.y,rnd(2,5),.55);
      if(g.vz<22){g.dead=true;stampGib(g)}
    }
    if(g.life<=0&&!g.dead){g.dead=true;stampGib(g)}
  }
  gibs=gibs.filter(g=>!g.dead);
  for(const t of texts){t.t-=dt;t.y-=18*dt}
  texts=texts.filter(t=>t.t>0);
}
function stampGib(g){
  dctx.save();dctx.translate(g.x,g.y);dctx.rotate(g.rot);
  if(g.k!=='metal'&&goreLvl>0){dctx.fillStyle='rgba(140,6,20,.55)';dctx.beginPath();dctx.ellipse(0,0,4*g.sz,3*g.sz,0,0,TAU);dctx.fill()}
  drawGibShape(dctx,g,.0);dctx.restore();
}
/* ---------- portales y radio ---------- */
function demonN(){let n=0;for(const e of enemies)if(!e.dead&&DEM(e))n++;return n}
function radio(who,msg){radioQ.push({who,msg,dur:Math.max(4.5,msg.length*.06)})}
function updPortals(dt){
  for(const p of portals){
    if(p.dead)continue;p.t+=dt;p.hit-=dt;
    const vis=p.y>camY-40&&p.y<camY+H+40;
    if(vis&&R()<dt*10)addPart({x:p.x+rnd(-p.r,p.r),y:p.y+rnd(-p.r*.5,p.r*.5),z:2,vx:rnd(-8,8),vy:0,vz:rnd(25,55),life:.9,max:.9,type:'fire',s:rnd(2,4),col:R()<.5?'#c040ff':'#d03a2c'});
    if(vis&&!p.major)p.aggro=true;
    if(p.major&&(!bossActive||bossDead))continue;
    if(p.aggro||p.major){p.cd-=dt;
      if(p.cd<=0){p.cd=rnd(5.5,8);
        if(demonN()<(p.major?8:6)){const n=ri(1,p.major?3:2);for(let i=0;i<n;i++){const e=addEnemy(R()<.5?'imp':'hound',p.x+rnd(-10,10),p.y+p.r*.7);e.aggro=true}
          sfx('portal',p.x);shake=Math.max(shake,3);spark(p.x,p.y,10,'#d060ff');ono(p.x,p.y-p.r,'GRRAAAH!','#a068c0',16)}}}
  }
  portals=portals.filter(p=>!p.dead);
}
function hurtPortal(po,d){
  if(po.dead||po.major)return;po.hp-=d;po.hit=.08;spark(po.x+rnd(-8,8),po.y+rnd(-8,8),3,'#d060ff');sfx('ping',po.x);
  if(po.hp<=0)killPortal(po);
}
function killPortal(po){
  po.dead=true;portalsClosed++;score+=800;
  explode(po.x,po.y,80,70,false,null);
  dctx.fillStyle='rgba(20,0,16,.8)';dctx.beginPath();dctx.arc(po.x,po.y,po.r*1.5,0,TAU);dctx.fill();
  ono(po.x,po.y-14,'KRAAAK!','#a068c0',26);addText(po.x,po.y-30,'PORTAL CERRADO +800','#b890d0');addBanner('PORTAL CERRADO '+portalsClosed+'/'+portalsTotal,'#b890d0',1.6);
  if(!SF.closed){SF.closed=1;radio('BASE HALCÓN','¡Señal limpia en ese sector! Sigue cerrándolos, Cuervo.')}
}
function updStory(dt){
  const prog=1-camY/(LH-H);
  if(!radioCur&&radioQ.length){radioCur=radioQ.shift();radioCur.t=0;sfx('radio')}
  if(radioCur){radioCur.t+=dt;if(radioCur.t>radioCur.dur)radioCur=null}
  if(!SF.s0&&tAll>1.2){SF.s0=1;radio('BASE HALCÓN','Cuervo, aquí Base Halcón. La Estación Aurora lleva 48 horas muda. Seis rehenes. Entra, sácalos y sal.')}
  if(!SF.s1&&prog>.12){SF.s1=1;radio('BASE HALCÓN','Contacto hostil. Mercenarios con túnicas rojas... no figuran en ningún registro.')}
  if(!SF.s2&&rescued>=1){SF.s2=1;radio('REHÉN','¡Escuche! Hay luces bajo la mina. Abren puertas... ¡puertas al infierno!')}
  if(!SF.s3&&prog>.4){SF.s3=1;portalPhase=true;radio('BASE HALCÓN','Cuervo... lecturas imposibles en tu zona. Eso no es tecnología humana.');addBanner('INVASIÓN INFERNAL','#d8403c',2.4);sfx('alarm');shake=8}
  if(!SF.s4&&prog>.68){SF.s4=1;radio('BASE HALCÓN','Destruye los portales o no pararán. Repito: ¡DESTRUYE LOS PORTALES!')}
}
/* ---------- main update ---------- */
function update(dt){
  tAll+=dt;hintT-=dt;onoCool-=dt;
  for(const p of players)updPlayer(p,dt);
  // camara (trinquete hacia arriba)
  const alive=players.filter(p=>p.alive);
  if(alive.length){
    const ty=Math.min(...alive.map(p=>p.y))-H*.55;
    const target=clamp(ty,0,LH-H);
    if(target<camY)camY+=(target-camY)*Math.min(1,dt*4);
  }
  camY=clamp(camY,0,LH-H);
  for(const e of enemies)updEnemy(e,dt);
  for(const v of vehicles)if(!v.dead&&!v.pilot){v.spd=0}
  vehicles=vehicles.filter(v=>!v.dead);
  enemies=enemies.filter(e=>!e.dead&&e.y<camY+H+130);
  updBullets(dt);updNades(dt);
  for(const b of barrels){if(b.fuse>=0){b.fuse-=dt;if(b.fuse<=0){b.dead=true;explode(b.x,b.y,62,125,false,null)}}}
  barrels=barrels.filter(b=>!b.dead);
  walls=walls.filter(w=>!w.dead);
  pickups=pickups.filter(k=>!k.got);
  updPortals(dt);updStory(dt);
  updParts(dt);
  for(const b of bleeders){b.t-=dt;if(Math.sin(b.t*16)>-.3)for(let i=0;i<3;i++){const aa=b.a+rnd(-.35,.35),sp=rnd(40,100);addPart({x:b.x,y:b.y,z:rnd(6,10),vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,vz:rnd(70,150),life:2,max:2,type:'blood',s:rnd(1.2,2.8),c:'#b01828'})}}
  bleeders=bleeders.filter(b=>b.t>0);
  for(const p of pools){if(p.r<p.max){p.r+=dt*9;if(R()<.6)stampBlood(p.x+rnd(-p.r*.4,p.r*.4),p.y+rnd(-p.r*.4,p.r*.4),p.r*rnd(.4,.8),.2)}else p.done=true}
  pools=pools.filter(p=>!p.done);
  for(const q of sBlood)q.t-=dt;sBlood=sBlood.filter(q=>q.t>0);
  // combo
  if(combo.t>0){combo.t-=dt;if(combo.t<=0){combo.n=0;combo.mult=1}}
  // refuerzos
  const prog=1-camY/(LH-H);
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=bossActive?rnd(6,9):rnd(3.6,5.6)*(1-prog*.3);
    const act=enemies.filter(e=>e.aggro&&!e.dead).length;
    if(act<6+prog*6&&camY>120){
      const n=ri(1,1+Math.floor(prog*2));
      for(let i=0;i<n;i++){const r=R();let k=r<.42?'runner':r<.62+prog*.2?'grunt':'heavy';if(prog>.4&&R()<.45)k=R()<.55?'imp':'hound';const e=addEnemy(k,rnd(30,610),camY-12-rnd(0,30));e.aggro=true}
    }
  }
  // tanque enemigo / estados
  shake=Math.max(0,shake-dt*22);flashA=Math.max(0,flashA-dt*1.5);
  if(bannerO){bannerO.t-=dt;if(bannerO.t<=0)bannerO=null}
  // fin de partida
  if(winT>0){winT-=dt;if(winT<=0){state='win';endT=0}}
  if(state==='play'&&players.every(p=>!p.alive&&p.lives<=0)){overT+=dt;if(overT>1.8){state='over';endT=0}}
}

/* ---------- drawing (estilo cómic) ---------- */
const FNT=s=>`${s}px Bangers, Impact, "Arial Black", sans-serif`;
const INK='#0d0a0c';

  ctx.fillStyle='#0a0408';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#d0581e';ctx.lineWidth=2;for(let i=0;i<26;i++){let x=(i*83)%w,y=h*.62+((i*37)%(h*.4));ctx.beginPath();ctx.moveTo(x,y);for(let k=0;k<4;k++){x+=((i*17+k*29)%28)-14;y+=((i*13+k*11)%14)+3;ctx.lineTo(x,y)}ctx.stroke()}
  drawPortal(w/2,h*.52,88,t);
  const eyes=[[.08,.2],[.2,.62],[.9,.25],[.82,.7],[.13,.85],[.95,.55],[.32,.12]];
  eyes.forEach((e,i)=>{if((Math.floor(t*1.3)+i)%5===0)return;ctx.fillStyle='#f0c040';ctx.strokeStyle=INK;ctx.lineWidth=1.5;for(const dx of[-7,7]){ctx.beginPath();ctx.ellipse(w*e[0]+dx,h*e[1],4,2.4,0,0,TAU);ctx.fill();ctx.stroke()}});
 },
 (w,h,t)=>{ // invasion
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2a0510');g.addColorStop(1,'#a01818');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(const[x,y,r]of[[w*.2,h*.55,30],[w*.52,h*.5,52],[w*.82,h*.6,34]]){const bg=ctx.createLinearGradient(0,0,0,y);bg.addColorStop(0,'rgba(255,90,40,0)');bg.addColorStop(1,'rgba(255,90,40,.45)');ctx.fillStyle=bg;ctx.fillRect(x-r*.6,0,r*1.2,y);drawPortal(x,y,r,t+x)}
  ctx.fillStyle='#14040c';ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,h*.82);for(let x=0;x<=w;x+=40)ctx.lineTo(x,h*.8+((x*7)%18));ctx.lineTo(w,h);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(w/2,h*.2);ctx.rotate(-.05);ctx.textAlign='center';ot('¡INVASIÓN!',4,4,INK,60,10);ot('¡INVASIÓN!',0,0,'#f0c040',60,8);ctx.restore();
 }];
function drawIntro(){
  ctx.fillStyle='#0d0a0c';ctx.fillRect(0,0,W,H);
  const P=INTRO[introI],px=36,py=16,pw=568,ph=250;
  ctx.save();ctx.beginPath();ctx.rect(px,py,pw,ph);ctx.clip();ctx.translate(px,py);SCENES[P.scene](pw,ph,introT);ctx.drawImage(halfC,-px,-py);ctx.restore();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(px-4,py-4,pw+8,ph+8);ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.strokeRect(px,py,pw,ph);
  box(px,276,pw,58);ctx.fillStyle=INK;ctx.font=FNT(17);ctx.textAlign='left';
  const lines=wrapText(P.t,pw-24);typed(lines,Math.floor(introT*38),px+12,298,20);
  ctx.textAlign='center';ot((introI+1)+' / '+INTRO.length,W/2,H-6,'#fff',11,3);
  if(Math.floor(tAll*2)%2)ot(IS_TOUCH?'TOCA PARA CONTINUAR ▶':'ENTER / CLIC ▶   ESC: SALTAR',W-110,H-6,'#f0c040',11,3);
  ctx.textAlign='left';
}

/* ---- HUD estilo cómic ---- */
function box(x,y,w,h,fill='#efe0a8'){ctx.fillStyle=INK;ctx.fillRect(x+3,y+3,w,h);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.strokeRect(x,y,w,h)}
function panel(p,x,right){
  const w=134,h=42,px=right?x-w:x,py=5;
  box(px,py,w,h);
  ctx.fillStyle=p.body;ctx.fillRect(px,py,40,13);ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.strokeRect(px,py,40,13);
  ctx.textAlign='left';ot('P'+(p.id+1)+(p.veh?' TANQUE':''),px+4,py+11,'#fff',11,3);
  const f=p.alive?(p.veh?p.veh.hp/p.veh.max:p.hp/p.max):0,n=14;
  for(let i=0;i<n;i++){const on=i/n<f;ctx.fillStyle=on?(f<.3?'#c83030':f<.6?'#e08a28':'#5a9a3a'):'#b8ab7a';ctx.fillRect(px+5+i*8,py+17,7,7);ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.strokeRect(px+5+.5+i*8,py+17.5,6,6)}
  const w_=WPN[p.wpn];ot(w_.n,px+5,py+38,w_.col==='#ff0'?'#e0a000':'#fff',11,3);
  ot(p.wpn?String(p.ammo[p.wpn]).padStart(3,'0'):'∞',px+88,py+38,'#fff',11,3);
  ot('●'+p.nades,px+100,py+11,'#7aa848',11,3);
  ot('♥'.repeat(Math.max(0,p.lives)),px+46,py+11,'#d8403c',11,3);
  if(!p.alive&&p.lives<=0){ctx.fillStyle='rgba(20,10,10,.8)';ctx.fillRect(px,py,w,h);ctx.textAlign='center';ot('K.I.A.',px+w/2,py+30,'#d8403c',20,4);ctx.textAlign='left'}
}
function drawHUD(){
  if(state==='title'){drawTitle();return}
  panel(players[0],6,false);
  if(players[1])panel(players[1],W-6,true);
  else if(state==='play'){ctx.textAlign='right';ot('[ENTER] UNIR P2',W-8,16,'#e8b830',11,3);ctx.textAlign='left'}
  drawRadio();
  ctx.textAlign='center';
  ot(String(score).padStart(7,'0'),W/2,24,'#f0c040',22,5);
  const prog=1-camY/(LH-H),bx=W/2-70;
  ctx.fillStyle=INK;ctx.fillRect(bx-2,29,144,10);ctx.fillStyle='#efe0a8';ctx.fillRect(bx,31,140,6);ctx.fillStyle='#c83030';ctx.fillRect(bx,31,140*prog,6);
  ot('☠',bx+146,38,'#fff',11,3);
  ot('BAJAS '+kills+'   RESCATE '+rescued+'/'+totalPow+'   PORTALES '+portalsClosed+'/'+portalsTotal,W/2,52,'#fff',10,3);
  if(combo.mult>1){const sc=1+Math.sin(tAll*14)*.05;ctx.save();ctx.translate(W/2,76);ctx.scale(sc,sc);star(0,0,17,10,9,tAll,'#c8402a',INK,3);ot('x'+combo.mult,0,6,'#f0c040',17,4);ctx.restore();ctx.fillStyle=INK;ctx.fillRect(W/2-22,92,44,5);ctx.fillStyle='#f0c040';ctx.fillRect(W/2-20,93,40*(combo.t/2.4),3)}
  if(bossActive&&boss&&!boss.dead){const f=Math.max(0,boss.hp/boss.max);box(W/2-122,H-24,244,13,'#3a1018');ctx.fillStyle='#c04a8a';ctx.fillRect(W/2-120,H-22,240*f,9);ot('EL CARNICERO MK-IV',W/2,H-27,'#fff',12,4)}
  if(bannerO){const k=Math.min(1,bannerO.t*3,(bannerO.max-bannerO.t)*6);ctx.save();ctx.globalAlpha=k;ctx.translate(W/2,H-84);ctx.rotate(-.04);ctx.scale(1+(1-k)*.3,1+(1-k)*.3);
    ot(bannerO.s,3,3,INK,30,8);ot(bannerO.s,0,0,bannerO.c==='#0ff'?'#f0c040':bannerO.c,30,6);ctx.restore();ctx.globalAlpha=1}
  for(const t of texts){if(!t.ui)continue;ctx.globalAlpha=Math.min(1,t.t*2);ot(t.s,t.x,t.y,t.c,16,4);ctx.globalAlpha=1}
  if(hintT>0&&state==='play'&&!IS_TOUCH){ctx.globalAlpha=Math.min(1,hintT);box(W/2-250,H-34,500,30,'#efe0a8');ctx.fillStyle=INK;ctx.font=FNT(11);
    ctx.fillText('P1: WASD o FLECHAS · MOUSE apuntar/disparar · CLIC DER / Q granada · E tanque',W/2,H-22);ctx.fillText('P2: FLECHAS · . disparar · / granada · , tanque   |   G gore · M mute · K música · P pausa',W/2,H-9);ctx.globalAlpha=1}
  ctx.textAlign='left';drawTouchUI();
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ot('PAUSA',W/2,H/2,'#f0c040',40,7);ctx.textAlign='left'}
  if(state==='over')endScreen(false);
  if(state==='win')endScreen(true);
}
function sunburst(c1,c2,n=22,sp=.1){
  const cx=W/2,cy=H*.45;ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.fillStyle=c2;
  for(let i=0;i<n;i++){const a0=i/n*TAU+tAll*sp,a1=a0+TAU/n/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a0)*700,cy+Math.sin(a0)*700);ctx.lineTo(cx+Math.cos(a1)*700,cy+Math.sin(a1)*700);ctx.closePath();ctx.fill()}
}
function endScreen(win){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.save();ctx.translate(W/2,92);ctx.rotate(-.05);ot(win?'¡MISIÓN CUMPLIDA!':'M.I.A.',4,4,INK,48,9);ot(win?'¡MISIÓN CUMPLIDA!':'M.I.A.',0,0,win?'#8ac860':'#d8403c',48,7);ctx.restore();
  box(W/2-150,118,300,118);
  const m=Math.floor(tAll/60),s=Math.floor(tAll%60);
  const L=['PUNTAJE   '+String(score).padStart(7,'0'),'BAJAS ENEMIGAS   '+kills,'CUERPOS DESTROZADOS   '+gibsN,'RESCATADOS   '+rescued+'/'+totalPow+'     PORTALES CERRADOS   '+portalsClosed+'/'+portalsTotal,'TIEMPO   '+m+':'+String(s).padStart(2,'0')];
  ctx.fillStyle=INK;ctx.font=FNT(14);L.forEach((l,i)=>ctx.fillText(l,W/2,142+i*20));
  if(win){ctx.fillStyle=INK;ctx.font=FNT(12);ctx.fillText('El Portal Mayor se derrumba... pero a lo lejos otra grieta roja se abre.',W/2,H-62);ot('CONTINUARÁ · HELLFRONT II',W/2,H-44,'#d8403c',20,5)}
  if(endT>1.2&&Math.floor(tAll*2)%2)ot('[ENTER] VOLVER AL MENÚ',W/2,H-26,'#f0c040',16,4);
  ctx.textAlign='left';
}
function drawTitle(){
  sunburst('#8a2a22','#c8602a',24,.07);
  ctx.drawImage(halfC,0,0);
  // heroe y enemigo gigantes
  ctx.save();ctx.translate(60,150);ctx.scale(4,4);soldier(0,0,-.35,{r:6,walk:tAll*3,body:'#3a68b0',helm:'#3a2412',trim:'#e02020',tail:true});ctx.restore();
  ctx.save();ctx.translate(585,170);ctx.scale(4,4);soldier(0,0,PI+.3,{r:6,walk:tAll*3,body:'#6b7a3a',helm:'#3d4a22',trim:'#d22',pack:'#4a4030'});ctx.restore();
  ctx.textAlign='center';
  box(14,12,210,24,'#efe0a8');ctx.fillStyle=INK;ctx.font=FNT(14);ctx.fillText('LA SAGA · ENTREGA ALTERNATIVA',119,29);
  ctx.save();ctx.translate(W/2,104);ctx.rotate(-.04);
  for(let k=7;k>0;k--)ot('HELLFRONT',k,k,'#4a0808',84,12);
  ot('HELLFRONT',0,0,'#f0c040',84,9);ctx.restore();
  ctx.save();ctx.translate(W/2,142);ctx.rotate(-.04);ctx.fillStyle=INK;ctx.fillRect(-128,-24,256,32);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-124,-21,248,26);ot('Z O N A   R O J A',0,0,'#d8403c',30,0);ctx.restore();
  star(530,70,34,22,10,tAll*.4,'#f0c040',INK,3);ot('GORE',530,68,'#b82828',16,3);ot('+ COOP',530,84,'#b82828',14,3);
  const bl=Math.floor(tAll*2)%2;
  ot(IS_TOUCH?'TOCA LA PANTALLA PARA JUGAR':'[ENTER] / CLIC  →  1 JUGADOR',W/2,196,bl?'#f0c040':'#fff',24,6);
  if(!IS_TOUCH)ot('[2]  →  CO-OP 2 JUGADORES',W/2,222,'#7ab4d0',18,5);
  box(W/2-228,244,456,56);ctx.fillStyle=INK;ctx.font=FNT(11);
  if(IS_TOUCH){ctx.fillText('JOYSTICK IZQ: mover · JOYSTICK DER: apuntar y disparar (auto-apuntado si no lo mueves)',W/2,261);ctx.fillText('G = granada · E = subir/bajar del tanque (acércate a uno)',W/2,277);ctx.fillText('Pistola · SMG · escopeta · lanzallamas · cohetes. Rescata prisioneros.',W/2,293);ctx.textAlign='left';return}
  ctx.fillText('P1: WASD o FLECHAS + MOUSE (clic izq disparar · clic der / Q granada · E tanque)',W/2,261);
  ctx.fillText('P2: FLECHAS · . disparar · / granada · , tanque      G gore · M sonido · K música · P pausa',W/2,277);
  ctx.fillText('Pistola · SMG · escopeta · lanzallamas · cohetes. ¡Rescata prisioneros y aplasta soldados con el tanque!',W/2,293);
  ctx.textAlign='left';
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){
    if(!paused){
      endT+=rdt;
      if(hitstop>0){hitstop-=rdt}
      else{let ts=1;if(slowT>0){ts=slowS;slowT-=rdt}update(rdt*ts)}
    }
  }else{tAll+=rdt;endT+=rdt;introT+=rdt;if(state==='over'||state==='win'){updParts(rdt)}}
  if(state==='title'){ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);drawTitle()}
  else if(state==='intro')drawIntro();
  else draw();
  requestAnimationFrame(frame);
}
try{document.fonts.load('20px Bangers')}catch(e){}
resetWorld();players=[mkPlayer(0)];
window.__game={start:startGame,tp(y){camY=y;for(const p of players){p.y=y+200;p.hp=p.max=999}},get s(){return{state,score,kills,camY,players,enemies:enemies.length,parts:parts.length,gibs:gibs.length}}};
requestAnimationFrame(frame);
</script>
