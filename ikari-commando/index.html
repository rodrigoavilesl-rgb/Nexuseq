<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ikari Commando Bloodline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
:root{--bg:#04050a;--neon:#00f0ff;--pink:#ff2bd6;--red:#ff2a3a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Courier New",monospace}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e8541e radial-gradient(circle,#ffcf1a 0 2px,transparent 2.5px) 0 0/10px 10px}
canvas{image-rendering:auto;background:#000;box-shadow:0 0 0 4px #0d0a0c,8px 8px 0 4px #0d0a0c;display:block;cursor:crosshair}
#vig{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="vig"></div>
<script>
'use strict';
/* =========================================================
   IKARI COMMANDO : BLOODLINE
   Secuela fusionada: tanques + rescate (Ikari) / avance vertical + granadas (Commando)
   ========================================================= */
const W=640,H=360,LH=5600;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const dc=document.createElement('canvas');dc.width=W;dc.height=LH;const dctx=dc.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();

/* ---------- util ---------- */
const R=Math.random,TAU=Math.PI*2,PI=Math.PI;
const rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*clamp(t,0,1);
const hash=(x,y)=>{let h=Math.imul(x*374761393+y*668265263,1274126177);h=(h^h>>>13)>>>0;return(h%1000)/1000};

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,muted=false;const sndT={};
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
    startMusic();
  }catch(e){AC=null}
}
function tone(f1,f2,dur,type='square',vol=.1){
  if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,fc=1500,type='bandpass',fc2){
  if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.setValueAtTime(fc,t);if(fc2)f.frequency.exponentialRampToValueAtTime(fc2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,R()*.5);s.stop(t+dur+.02);
}
const TH={fire:80,shot:25,hit:35,splat:40,boom:60};
function sfx(n){
  const now=performance.now();if(sndT[n]&&now-sndT[n]<(TH[n]||30))return;sndT[n]=now;
  switch(n){
    case'pistol':tone(420,90,.09,'square',.07);noise(.07,.12,2200);break;
    case'smg':tone(300,100,.06,'square',.05);noise(.05,.09,2600);break;
    case'shot':noise(.22,.3,900,'lowpass',200);tone(120,40,.15,'sawtooth',.12);break;
    case'fire':noise(.12,.11,600,'bandpass',300);break;
    case'rocket':noise(.3,.18,500,'lowpass',150);tone(200,60,.25,'sawtooth',.08);break;
    case'cannon':noise(.35,.3,400,'lowpass',90);tone(90,30,.3,'sawtooth',.2);break;
    case'hit':noise(.04,.1,3500);break;
    case'splat':noise(.12,.2,500,'lowpass',200);tone(140,50,.1,'sine',.15);break;
    case'gib':noise(.3,.3,400,'lowpass',100);tone(80,30,.25,'sine',.25);break;
    case'boom':noise(.7,.5,700,'lowpass',60);tone(70,25,.6,'sawtooth',.25);break;
    case'hurt':tone(220,70,.2,'sawtooth',.14);break;
    case'pick':tone(500,900,.12,'square',.07);tone(900,1300,.1,'square',.06);break;
    case'nade':tone(300,200,.05,'square',.05);break;
    case'alarm':tone(900,400,.3,'sawtooth',.1);break;
  }
}
function startMusic(){
  let st=0;const bass=[55,55,0,55,65.4,0,55,0,49,49,0,49,58.3,0,58.3,73.4];
  setInterval(()=>{
    if(!AC||muted||(state!=='play'&&state!=='title')||paused)return;
    const f=bass[st%16];if(f)tone(f,f*.98,.13,'sawtooth',.045);
    if(st%4===0)tone(130,38,.12,'sine',.16);
    if(st%2===1)noise(.03,.025,8000,'highpass');
    if(st%16===8)tone(f*4||220,f*4||220,.3,'triangle',.025);
    st++;
  },112);
}

/* ---------- input ---------- */
const keys={},mouse={x:W/2,y:H/2,down:false,right:false,seen:false};
cv.tabIndex=0;cv.style.outline='none';const foc=()=>{try{cv.focus({preventScroll:true})}catch(_){}};foc();addEventListener('pointerdown',foc);addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=mouse.right=false});
addEventListener('keydown',e=>{foc();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period','Comma'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){keys[e.code]=true;onKey(e.code)}
});
addEventListener('keyup',e=>{keys[e.code]=false});
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;mouse.seen=true}
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',e=>{mpos(e);audioInit();if(e.button===0)mouse.down=true;if(e.button===2)mouse.right=true;if(state==='title')startGame(1);e.preventDefault()});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.right=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function onKey(c){
  audioInit();
  if(c==='KeyM')muted=!muted;
  if(c==='KeyG'){goreLvl=(goreLvl+1)%3;addText(W/2,40,'GORE: '+['OFF','MEDIO','MÁXIMO'][goreLvl],'#f33',true)}
  if(c==='KeyP'&&state==='play')paused=!paused;
  if(state==='title'){if(c==='Enter'||c==='Digit1')startGame(1);if(c==='Digit2')startGame(2)}
  else if(state==='over'||state==='win'){if(c==='Enter'&&endT>1.2)state='title'}
  else if(state==='play'&&c==='Enter'&&players.length===1){joinP2()}
}
function pad(i){const g=navigator.getGamepads?navigator.getGamepads():[];return g[i]&&g[i].connected?g[i]:null}
function readInput(p){
  const o={mx:0,my:0,aim:null,fire:false,nade:false,use:false};
  const g=pad(p.id),dz=v=>Math.abs(v)<.25?0:v;
  if(p.id===0){
    const solo=players.length===1;o.mx=(keys.KeyD||(solo&&keys.ArrowRight)?1:0)-(keys.KeyA||(solo&&keys.ArrowLeft)?1:0);o.my=(keys.KeyS||(solo&&keys.ArrowDown)?1:0)-(keys.KeyW||(solo&&keys.ArrowUp)?1:0);
    o.fire=mouse.down||keys.Space||(solo&&keys.Period);o.nade=mouse.right||keys.KeyQ||(solo&&keys.Slash);o.use=!!keys.KeyE;
    if(mouse.seen){o.aim=Math.atan2(mouse.y+camY-p.y,mouse.x-p.x);o.mdist=Math.hypot(mouse.y+camY-p.y,mouse.x-p.x)}
  }else{
    o.mx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);o.my=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
    o.fire=!!keys.Period;o.nade=!!keys.Slash;o.use=!!keys.Comma;
  }
  if(g){
    const gx=dz(g.axes[0]||0),gy=dz(g.axes[1]||0),ax=dz(g.axes[2]||0),ay=dz(g.axes[3]||0);
    if(gx||gy){o.mx=gx;o.my=gy}
    if(ax||ay){o.aim=Math.atan2(ay,ax);o.mdist=120}
    const b=i=>g.buttons[i]&&g.buttons[i].pressed;
    o.fire=o.fire||b(7)||b(5)||b(0);o.nade=o.nade||b(6)||b(4)||b(1);o.use=o.use||b(2)||b(3);
  }
  if(o.aim===null&&(o.mx||o.my))o.aim=Math.atan2(o.my,o.mx);
  if(o.aim===null)o.aim=p.aim;
  return o;
}

/* ---------- world state ---------- */
let state='title',paused=false,goreLvl=2,endT=0,t0=0,tAll=0;
let players,bullets,enemies,parts,gibs,pickups,walls,barrels,vehicles,nades,texts,water,boss;
let camY=LH-H,shake=0,flashA=0,hitstop=0,slowT=0,slowS=1,score=0,kills=0,rescued=0,gibsN=0;
let combo={n:0,t:0,mult:1},bannerO=null,spawnT=3,bossActive=false,bossDead=false,winT=0,overT=0,hintT=8;

const WPN=[
  {n:'PISTOLA',rate:.2,dmg:15,spd:430,spread:.03,pel:1,life:.9,col:'#9ff',snd:'pistol'},
  {n:'SMG',rate:.07,dmg:9,spd:480,spread:.07,pel:1,life:.8,col:'#ff0',snd:'smg'},
  {n:'ESCOPETA',rate:.55,dmg:12,spd:430,spread:.26,pel:8,life:.3,col:'#fa0',snd:'shot'},
  {n:'LANZALLAMAS',rate:.035,dmg:3.2,spd:210,spread:.16,pel:1,life:.42,col:'#f60',snd:'fire',fire:1},
  {n:'COHETES',rate:.75,dmg:30,spd:300,spread:0,pel:1,life:1.3,col:'#f0f',snd:'rocket',rocket:1}
];
const WAMMO=[0,140,24,220,12],WMAX=[0,320,48,420,26];
const EK={
  grunt:{hp:30,r:6,sp:46,sc:100,body:'#6b7a3a',helm:'#3d4a22',trim:'#d22'},
  runner:{hp:20,r:6,sp:108,sc:120,body:'#c0472c',helm:'#e8b890',trim:'#fff'},
  heavy:{hp:170,r:9,sp:28,sc:450,body:'#4a505e',helm:'#22252e',trim:'#ff9a1a',pack:'#2a2a32',arm:.7},
  turret:{hp:120,r:9,sp:0,sc:300,arm:.5},
  tank:{hp:450,r:16,sp:26,sc:1500,arm:.35},
  boss:{hp:1500,r:28,sp:0,sc:15000,arm:.3}
};

function resetWorld(){
  bullets=[];enemies=[];parts=[];gibs=[];pickups=[];walls=[];barrels=[];vehicles=[];nades=[];texts=[];water=[];boss=null;
  dctx.clearRect(0,0,W,LH);camY=LH-H;shake=0;flashA=0;hitstop=0;slowT=0;score=0;kills=0;rescued=0;gibsN=0;
  combo={n:0,t:0,mult:1};bannerO=null;spawnT=3;bossActive=false;bossDead=false;winT=0;overT=0;hintT=9;paused=false;tAll=0;
}
function mkPlayer(id){
  return{id,x:300+id*50,y:LH-50,r:6,hp:100,max:100,lives:3,alive:true,aim:-PI/2,wpn:0,ammo:[0,0,0,0,0],nades:5,cd:0,ncd:0,inv:2,
    veh:null,respawn:0,walk:0,useL:false,kills:0,col:id?'#ffcf1a':'#5ab4ff',trim:id?'#fff':'#e02020',body:id?'#e0a020':'#2f6fe0',helm:'#3a2412'};
}
function startGame(n){
  resetWorld();players=[mkPlayer(0)];if(n===2)players.push(mkPlayer(1));
  genLevel();genGround();state='play';audioInit();
  addBanner('LOCK & LOAD','#0ff',2);
}
function joinP2(){if(players.length>1)return;const p=mkPlayer(1);p.x=players[0].x+30;p.y=Math.min(players[0].y,camY+H-30);players.push(p);if(boss)boss.max*=1.3,boss.hp*=1.3;addBanner('JUGADOR 2 EN LÍNEA','#f2d',1.5)}

/* ---------- level ---------- */
function blocked(x,y,r){return hitWall(x,y,r)}
function freeSpot(x,y,r){for(let i=0;i<10;i++){const nx=x+(i?rnd(-30,30):0),ny=y+(i?rnd(-30,30):0);if(!hitWall(nx,ny,r+3)&&nx>20&&nx<W-20)return{x:nx,y:ny}}return{x,y}}
function addEnemy(k,x,y){
  const d=EK[k],s=freeSpot(x,y,d.r),e={kind:k,x:s.x,y:s.y,r:d.r,hp:d.hp,max:d.hp,sp:d.sp*rnd(.9,1.1),cd:rnd(.6,2.2),aggro:false,face:PI/2,walk:0,burn:0,hit:0,dead:false,t:rnd(0,6),mt:0,burst:ri(2,4),
    a1:2,a2:3,a3:6,dir:R()<.5?1:-1,ang:PI/2,tang:PI/2};
  enemies.push(e);return e;
}
function sandbags(x,y,n,vert){for(let i=0;i<n;i++)walls.push(vert?{x,y:y+i*12,w:12,h:12,t:'sand'}:{x:x+i*16,y,w:16,h:11,t:'sand'})}
function crate(x,y){walls.push({x,y,w:16,h:16,t:'crate',hp:45})}
function barrel(x,y){barrels.push({x,y,r:8,hp:30,fuse:-1})}
function pickup(k,x,y,v){pickups.push({k,x,y,v,t:rnd(0,6)})}
function genLevel(){
  let y=LH-380;
  // arranque: tanque + suministros
  vehicles.push({x:250,y:LH-120,ang:-PI/2,tang:-PI/2,hp:300,max:300,pilot:null,r:13,cd:0,cd2:0,dead:false,spd:0,en:false});
  pickup('wpn',380,LH-140,2);
  let n=0;
  while(y>620){
    const p=1-y/LH,roll=R(),cx=rnd(90,550);
    if(roll<.26)coverZone(cx,y,p);
    else if(roll<.44)ruin(cx,y,p);
    else if(roll<.56)barrelZone(cx,y,p);
    else if(roll<.68)bunker(y,p);
    else if(roll<.78)prisonerZone(cx,y,p);
    else if(roll<.88&&p>.3)enemyTank(cx,y,p);
    else patrol(y,p);
    if(R()<.3)water.push({x:rnd(30,460),y:y-rnd(50,110),w:rnd(80,150),h:rnd(36,70)});
    if(R()<.2)pickup(['hp','gren','wpn'][ri(0,2)],rnd(60,580),y-rnd(40,120),ri(1,4));
    if(n===6||n===13){vehicles.push({x:rnd(120,500),y:y-60,ang:-PI/2,tang:-PI/2,hp:300,max:300,pilot:null,r:13,cd:0,cd2:0,dead:false,spd:0});pickup('hp',rnd(100,500),y-70)}
    y-=rnd(190,270);n++;
  }
  // arena del jefe
  vehicles.push({x:300,y:900,ang:-PI/2,tang:-PI/2,hp:300,max:300,pilot:null,r:13,cd:0,cd2:0,dead:false,spd:0});
  pickup('hp',200,820,1);pickup('hp',440,820,1);pickup('wpn',320,760,4);pickup('gren',560,800,1);
  for(const x of[90,550]){barrel(x,520);barrel(x+14,530)}
  sandbags(120,420,4);sandbags(430,420,4);
  boss=addEnemy('boss',320,140);boss.max=boss.hp=EK.boss.hp;
}
function coverZone(cx,y,p){
  sandbags(cx-40,y,3);sandbags(cx+30,y+8,3);
  const n=ri(2,3+Math.floor(p*3));for(let i=0;i<n;i++)addEnemy(R()<.8?'grunt':'runner',cx+rnd(-90,90),y-rnd(20,70));
  if(p>.3&&R()<.5)addEnemy('heavy',cx+rnd(-60,60),y-rnd(60,100));
}
function ruin(cx,y,p){
  const x0=cx-80,w=160,h=80,t=14;
  walls.push({x:x0,y:y-h,w:w,h:t,t:'conc'},{x:x0,y:y-h,w:t,h:h,t:'conc'},{x:x0+w-t,y:y-h,w:t,h:h,t:'conc'},
    {x:x0,y:y-t,w:55,h:t,t:'conc'},{x:x0+w-55,y:y-t,w:55,h:t,t:'conc'});
  crate(x0+24,y-h+20);crate(x0+w-44,y-h+20);
  if(R()<.6)pickup(['wpn','hp','gren'][ri(0,2)],cx,y-h+30,ri(1,4));
  addEnemy(p>.4?'heavy':'grunt',cx,y-40);
  for(let i=0;i<ri(2,4);i++)addEnemy('grunt',cx+rnd(-100,100),y+rnd(10,50));
  if(R()<.5)addEnemy('turret',x0-10,y-h/2);
}
function barrelZone(cx,y,p){
  for(let i=0;i<ri(3,5);i++)barrel(cx+rnd(-30,30),y-rnd(0,30));
  for(let i=0;i<ri(2,4);i++)addEnemy('grunt',cx+rnd(-80,80),y-rnd(30,70));
  if(R()<.5)addEnemy('runner',cx+rnd(-40,40),y-60);
}
function bunker(y,p){
  const side=R()<.5?60:W-60;
  sandbags(side-24,y,3);sandbags(side-24,y+12,3);
  addEnemy('turret',side,y+6);
  addEnemy('grunt',W-side,y-20);addEnemy('grunt',W/2,y-40);
}
function prisonerZone(cx,y,p){
  sandbags(cx-34,y-20,2,true);sandbags(cx+22,y-20,2,true);
  pickup('pow',cx,y-8);
  for(let i=0;i<ri(3,4);i++)addEnemy('grunt',cx+rnd(-100,100),y-rnd(40,90));
  if(p>.4)addEnemy('heavy',cx,y-100);
}
function enemyTank(cx,y,p){addEnemy('tank',cx,y-40);for(let i=0;i<2;i++)addEnemy('grunt',cx+rnd(-100,100),y);barrel(cx+60,y-10)}
function patrol(y,p){for(let i=0;i<ri(3,6);i++)addEnemy(R()<.5?'runner':'grunt',rnd(60,580),y-rnd(0,60))}

/* ---------- collisions ---------- */
function hitWall(x,y,r){
  for(const w of walls){if(w.dead)continue;if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return w}
  return null;
}
function move(e,dx,dy,r){let m=false;if(!hitWall(e.x+dx,e.y,r)){e.x+=dx;m=true}if(!hitWall(e.x,e.y+dy,r)){e.y+=dy;m=true}return m}
function inWater(e){for(const w of water)if(e.x>w.x&&e.x<w.x+w.w&&e.y>w.y&&e.y<w.y+w.h)return true;return false}

/* ---------- fx helpers ---------- */
let onoCool=0;
function ono(x,y,s,c,size){if(onoCool>0||texts.length>14)return;onoCool=.16;texts.push({x,y,s,c,t:.95,ono:1,size,rot:rnd(-.3,.3)})}
function addText(x,y,s,c,ui){texts.push({x,y,s,c,t:1.1,ui})}
function addBanner(s,c,d=1.6){bannerO={s,c,t:d,max:d}}
function addPart(o){if(parts.length<1800)parts.push(o)}
function slow(t,s){slowT=Math.max(slowT,t);slowS=s}
function spark(x,y,n,c='#ffd060'){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,160);addPart({x,y,z:4,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:rnd(0,60),life:rnd(.1,.3),max:.3,type:'spark',c})}}
function bloodSpray(x,y,a,n,spd,spr){
  if(goreLvl===0){spark(x,y,2,'#fff');return}
  n=goreLvl===1?Math.ceil(n/2):n;
  for(let i=0;i<n;i++){
    const aa=a+rnd(-spr,spr),s=rnd(spd*.3,spd);
    addPart({x,y,z:rnd(2,8),vx:Math.cos(aa)*s,vy:Math.sin(aa)*s,vz:rnd(20,130),life:2,max:2,type:'blood',s:rnd(1,2.6),c:R()<.25?'#ff2a44':'#d0122a'});
  }
}
function stampBlood(x,y,r,a=.55,c='150,6,22'){dctx.fillStyle=`rgba(${c},${a})`;dctx.beginPath();dctx.ellipse(x,y,r,r*rnd(.6,1),rnd(0,PI),0,TAU);dctx.fill()}
function pool(x,y,r){if(goreLvl===0)return;for(let i=0;i<(goreLvl===2?7:3);i++)stampBlood(x+rnd(-r*.5,r*.5),y+rnd(-r*.5,r*.5),rnd(r*.3,r*.8),rnd(.35,.6))}
function stampCorpse(e,charred){
  dctx.save();dctx.translate(e.x,e.y);dctx.rotate(rnd(0,TAU));
  const d=EK[e.kind],r=e.r;
  if(goreLvl>0&&!charred)pool(e.x,e.y,r*2.6);
  dctx.save();dctx.translate(0,0);dctx.rotate(0);
  const base=charred?'#1a1612':d.body;

function driveVehicle(p,inp,dt){

    v.x-=Math.cos(a)*2;v.y-=Math.sin(a)*2}

      e.mt-=dt;if(e.mt<=0){e.mt=rnd(1,2.5);e.dir*=-1}
      if(!move(e,mx*e.sp*dt,my*e.sp*dt,e.r))e.dir*=-1;e.walk+=dt*9;
      e.cd-=dt;if(e.cd<=0&&d<290){eShoot(e,a+rnd(-.13,.13),150,8);if(--e.burst>0)e.cd=.14;else{e.cd=rnd(1.3,2.5);e.burst=ri(2,4)}}
      break}

/* ---------- update: bullets / nades / misc ---------- */
function bulletEnd(b){
  if(b.t==='rocket')explode(b.x,b.y,b.er,b.ed,false,b.pl);
  else if(b.t==='eshell')explode(b.x,b.y,b.er,b.ed,true);
}
function updBullets(dt){
  for(const b of bullets){
    const sp=Math.hypot(b.vx,b.vy),steps=Math.max(1,Math.ceil(sp*dt/4)),sdt=dt/steps;
    for(let s=0;s<steps&&!b.dead;s++){
      b.x+=b.vx*sdt;b.y+=b.vy*sdt;b.life-=sdt;
      if(b.x<-10||b.x>W+10||b.y<camY-40||b.y>camY+H+40){b.dead=true;break}
      if(b.t==='rocket'&&R()<.5)addPart({x:b.x,y:b.y,z:3,vx:rnd(-8,8),vy:rnd(-8,8),vz:10,life:.5,max:.5,type:'smoke',s:rnd(2,4)});
      if(b.t==='fire'&&R()<.35)addPart({x:b.x,y:b.y,z:rnd(1,5),vx:rnd(-10,10),vy:rnd(-10,10),vz:rnd(10,40),life:.3,max:.3,type:'fire',s:rnd(3,6)});
      const w=hitWall(b.x,b.y,1);
      if(w){
        if(w.t==='crate'){w.hp-=b.dmg||20;if(w.hp<=0)breakCrate(w)}
        spark(b.x,b.y,3);if(b.t==='fire'){if(R()<.3)b.dead=true}else{bulletEnd(b);b.dead=true}break;
      }
      if(b.life<=0){bulletEnd(b);b.dead=true;break}
      for(const br of barrels){if(Math.hypot(br.x-b.x,br.y-b.y)<br.r+b.r){if(b.t==='fire'||b.own===0||true){if(b.t==='rocket'){bulletEnd(b)}else hurtBarrel(br,b.dmg||20);if(b.t!=='fire')b.dead=true}break}}
      if(b.dead)break;
      if(b.own===0){
        for(const e of enemies){
          if(e.dead||e.dying)continue;
          if(b.hits&&b.hits.has(e))continue;
          if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
            if(b.t==='rocket'){bulletEnd(b);b.dead=true;break}
            if(b.hits)b.hits.add(e);
            hurtEnemy(e,b.dmg,Math.atan2(b.vy,b.vx),b.t,b.pl);
            if(!b.pierce){b.dead=true;break}
          }
        }
      }else{
        for(const p of players){
          if(!p.alive)continue;
          const rr=p.veh?13:p.r;
          if(Math.hypot(p.x-b.x,p.y-b.y)<rr+b.r){
            if(b.t==='eshell'){bulletEnd(b);b.dead=true;break}
            if(p.inv<=0||p.veh){if(p.veh)hurtVehicle(p.veh,b.dmg*.7);else hurtPlayer(p,b.dmg,Math.atan2(b.vy,b.vx),'b')}
            b.dead=true;break;
          }
        }
        if(!b.dead)for(const v of vehicles){if(!v.pilot&&!v.dead&&Math.hypot(v.x-b.x,v.y-b.y)<v.r){spark(b.x,b.y,2);b.dead=true;break}}
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
}
function updNades(dt){
  for(const n of nades){
    n.t+=dt;n.vz-=520*dt;n.z+=n.vz*dt;
    const nx=n.x+n.vx*dt,ny=n.y+n.vy*dt;
    if(hitWall(nx,n.y,3))n.vx*=-.4;else n.x=nx;
    if(hitWall(n.x,ny,3))n.vy*=-.4;else n.y=ny;
    if(n.z<=0){n.z=0;n.vz=Math.abs(n.vz)*.3;n.vx*=.55;n.vy*=.55}
    n.fuse-=dt;
    if(n.fuse<=0){n.dead=true;explode(n.x,n.y,58,115,false,n.pl)}
  }
  nades=nades.filter(n=>!n.dead);
}
function updParts(dt){
  for(const p of parts){
    p.life-=dt;if(p.life<=0){p.dead=true;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='blood'){p.vz-=520*dt;p.z+=p.vz*dt;if(p.z<=0){p.dead=true;stampBlood(p.x,p.y,p.s*rnd(.8,1.6),.6)}}
    else if(p.type==='shell'){p.vz-=520*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=Math.abs(p.vz)*.4;p.vx*=.5;p.vy*=.5}}
    else if(p.type==='fire'||p.type==='smoke'){p.z+=(p.vz||20)*dt;p.vx*=.96;p.vy*=.96}
    else if(p.type==='spark'){p.vz-=300*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz*=-.3}}
  }
  parts=parts.filter(p=>!p.dead);
  for(const g of gibs){
    g.life-=dt;g.vz-=520*dt;g.z+=g.vz*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.vr*dt;
    if(g.z>3&&R()<dt*20&&g.k!=='metal')bloodSpray(g.x,g.y,0,1,30,PI);
    if(g.z<=0){
      g.z=0;g.vz=Math.abs(g.vz)*.35;g.vx*=.6;g.vy*=.6;g.vr*=.6;
      if(g.k!=='metal')stampBlood(g.x,g.y,rnd(2,5),.55);
      if(g.vz<22){g.dead=true;stampGib(g)}
    }
    if(g.life<=0&&!g.dead){g.dead=true;stampGib(g)}
  }
  gibs=gibs.filter(g=>!g.dead);
  for(const t of texts){t.t-=dt;t.y-=18*dt}
  texts=texts.filter(t=>t.t>0);
}
function stampGib(g){
  dctx.save();dctx.translate(g.x,g.y);dctx.rotate(g.rot);
  if(g.k!=='metal'&&goreLvl>0){dctx.fillStyle='rgba(140,6,20,.55)';dctx.beginPath();dctx.ellipse(0,0,4*g.sz,3*g.sz,0,0,TAU);dctx.fill()}
  drawGibShape(dctx,g,.0);dctx.restore();
}
/* ---------- main update ---------- */
function update(dt){
  tAll+=dt;hintT-=dt;onoCool-=dt;
  for(const p of players)updPlayer(p,dt);
  // camara (trinquete hacia arriba)
  const alive=players.filter(p=>p.alive);
  if(alive.length){
    const ty=Math.min(...alive.map(p=>p.y))-H*.55;
    const target=clamp(ty,0,LH-H);
    if(target<camY)camY+=(target-camY)*Math.min(1,dt*4);
  }
  camY=clamp(camY,0,LH-H);
  for(const e of enemies)updEnemy(e,dt);
  for(const v of vehicles)if(!v.dead&&!v.pilot){v.spd=0}
  vehicles=vehicles.filter(v=>!v.dead);
  enemies=enemies.filter(e=>!e.dead&&e.y<camY+H+130);
  updBullets(dt);updNades(dt);
  for(const b of barrels){if(b.fuse>=0){b.fuse-=dt;if(b.fuse<=0){b.dead=true;explode(b.x,b.y,62,125,false,null)}}}
  barrels=barrels.filter(b=>!b.dead);
  walls=walls.filter(w=>!w.dead);
  pickups=pickups.filter(k=>!k.got);
  updParts(dt);
  // combo
  if(combo.t>0){combo.t-=dt;if(combo.t<=0){combo.n=0;combo.mult=1}}
  // refuerzos
  const prog=1-camY/(LH-H);
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=bossActive?rnd(6,9):rnd(2.5,4.2)*(1-prog*.4);
    const act=enemies.filter(e=>e.aggro&&!e.dead).length;
    if(act<9+prog*10&&camY>120){
      const n=ri(1,2+Math.floor(prog*3));
      for(let i=0;i<n;i++){const r=R(),k=r<.42?'runner':r<.62+prog*.2?'grunt':'heavy';const e=addEnemy(k,rnd(30,610),camY-12-rnd(0,30));e.aggro=true}
    }
  }
  // tanque enemigo / estados
  shake=Math.max(0,shake-dt*22);flashA=Math.max(0,flashA-dt*1.5);
  if(bannerO){bannerO.t-=dt;if(bannerO.t<=0)bannerO=null}
  // fin de partida
  if(winT>0){winT-=dt;if(winT<=0){state='win';endT=0}}
  if(state==='play'&&players.every(p=>!p.alive&&p.lives<=0)){overT+=dt;if(overT>1.8){state='over';endT=0}}
}

const ZN=[{p:0,g:[96,150,52],g2:[78,128,40],d:[44,88,26]},{p:.3,g:[214,176,104],g2:[196,154,84],d:[150,112,60]},{p:.62,g:[150,156,168],g2:[130,136,150],d:[84,90,104]},{p:.88,g:[146,62,46],g2:[124,48,36],d:[70,26,22]}];

const roadX=y=>320+Math.sin(y/380)*80+Math.sin(y/130)*14;

  ot('●'+p.nades,px+100,py+11,'#7ad04a',11,3);
  ot('♥'.repeat(Math.max(0,p.lives)),px+46,py+11,'#ff3a50',11,3);
  if(!p.alive&&p.lives<=0){ctx.fillStyle='rgba(20,10,10,.8)';ctx.fillRect(px,py,w,h);ctx.textAlign='center';ot('K.I.A.',px+w/2,py+30,'#ff3a50',20,4);ctx.textAlign='left'}
}
function drawHUD(){
  if(state==='title'){drawTitle();return}
  panel(players[0],6,false);
  if(players[1])panel(players[1],W-6,true);
  else if(state==='play'){ctx.textAlign='right';ot('[ENTER] UNIR P2',W-8,16,'#ffd21a',11,3);ctx.textAlign='left'}
  ctx.textAlign='center';
  ot(String(score).padStart(7,'0'),W/2,24,'#ffe033',22,5);
  const prog=1-camY/(LH-H),bx=W/2-70;
  ctx.fillStyle=INK;ctx.fillRect(bx-2,29,144,10);ctx.fillStyle='#fff2b0';ctx.fillRect(bx,31,140,6);ctx.fillStyle='#e01830';ctx.fillRect(bx,31,140*prog,6);
  ot('☠',bx+146,38,'#fff',11,3);
  ot('BAJAS '+kills+'   RESCATADOS '+rescued+'   GORE '+['OFF','MED','MAX'][goreLvl],W/2,52,'#fff',10,3);
  if(combo.mult>1){const sc=1+Math.sin(tAll*14)*.05;ctx.save();ctx.translate(W/2,76);ctx.scale(sc,sc);star(0,0,17,10,9,tAll,'#e8402a',INK,3);ot('x'+combo.mult,0,6,'#ffe033',17,4);ctx.restore();ctx.fillStyle=INK;ctx.fillRect(W/2-22,92,44,5);ctx.fillStyle='#ffe033';ctx.fillRect(W/2-20,93,40*(combo.t/2.4),3)}
  if(bossActive&&boss&&!boss.dead){const f=Math.max(0,boss.hp/boss.max);box(W/2-122,H-24,244,13,'#3a1018');ctx.fillStyle='#ff2bd6';ctx.fillRect(W/2-120,H-22,240*f,9);ot('BLOODHOUND MK-IV',W/2,H-27,'#fff',12,4)}
  if(bannerO){const k=Math.min(1,bannerO.t*3,(bannerO.max-bannerO.t)*6);ctx.save();ctx.globalAlpha=k;ctx.translate(W/2,H-84);ctx.rotate(-.04);ctx.scale(1+(1-k)*.3,1+(1-k)*.3);
    ot(bannerO.s,3,3,INK,30,8);ot(bannerO.s,0,0,bannerO.c==='#0ff'?'#ffe033':bannerO.c,30,6);ctx.restore();ctx.globalAlpha=1}
  for(const t of texts){if(!t.ui)continue;ctx.globalAlpha=Math.min(1,t.t*2);ot(t.s,t.x,t.y,t.c,16,4);ctx.globalAlpha=1}
  if(hintT>0&&state==='play'){ctx.globalAlpha=Math.min(1,hintT);box(W/2-250,H-34,500,30,'#fff2b0');ctx.fillStyle=INK;ctx.font=FNT(11);
    ctx.fillText('P1: WASD o FLECHAS · MOUSE apuntar/disparar · CLIC DER / Q granada · E tanque',W/2,H-22);ctx.fillText('P2: FLECHAS · . disparar · / granada · , tanque   |   G gore · M mute · P pausa',W/2,H-9);ctx.globalAlpha=1}
  ctx.textAlign='left';
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ot('PAUSA',W/2,H/2,'#ffe033',40,7);ctx.textAlign='left'}
  if(state==='over')endScreen(false);
  if(state==='win')endScreen(true);
}
function sunburst(c1,c2,n=22,sp=.1){
  const cx=W/2,cy=H*.45;ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.fillStyle=c2;
  for(let i=0;i<n;i++){const a0=i/n*TAU+tAll*sp,a1=a0+TAU/n/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a0)*700,cy+Math.sin(a0)*700);ctx.lineTo(cx+Math.cos(a1)*700,cy+Math.sin(a1)*700);ctx.closePath();ctx.fill()}
}
function endScreen(win){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.save();ctx.translate(W/2,92);ctx.rotate(-.05);ot(win?'¡MISIÓN CUMPLIDA!':'M.I.A.',4,4,INK,48,9);ot(win?'¡MISIÓN CUMPLIDA!':'M.I.A.',0,0,win?'#7aff5a':'#ff3a50',48,7);ctx.restore();
  box(W/2-130,118,260,118);
  const m=Math.floor(tAll/60),s=Math.floor(tAll%60);
  const L=['PUNTAJE   '+String(score).padStart(7,'0'),'BAJAS ENEMIGAS   '+kills,'CUERPOS DESTROZADOS   '+gibsN,'PRISIONEROS RESCATADOS   '+rescued,'TIEMPO   '+m+':'+String(s).padStart(2,'0')];
  ctx.fillStyle=INK;ctx.font=FNT(15);L.forEach((l,i)=>ctx.fillText(l,W/2,142+i*20));
  if(endT>1.2&&Math.floor(tAll*2)%2)ot('[ENTER] VOLVER AL MENÚ',W/2,H-26,'#ffe033',16,4);
  ctx.textAlign='left';
}
function drawTitle(){
  sunburst('#b81c1c','#e8541e',24,.07);
  ctx.drawImage(halfC,0,0);
  // heroe y enemigo gigantes
  ctx.save();ctx.translate(60,150);ctx.scale(4,4);soldier(0,0,-.35,{r:6,walk:tAll*3,body:'#2f6fe0',helm:'#3a2412',trim:'#e02020',tail:true});ctx.restore();
  ctx.save();ctx.translate(585,170);ctx.scale(4,4);soldier(0,0,PI+.3,{r:6,walk:tAll*3,body:'#6b7a3a',helm:'#3d4a22',trim:'#d22',pack:'#4a4030'});ctx.restore();
  ctx.textAlign='center';
  box(14,12,170,24,'#fff2b0');ctx.fillStyle=INK;ctx.font=FNT(14);ctx.fillText('SECUELA FUSIONADA',99,29);
  ctx.save();ctx.translate(W/2,98);ctx.rotate(-.04);
  for(let k=7;k>0;k--)ot('IKARI COMMANDO',k,k,'#4a0808',60,10);
  ot('IKARI COMMANDO',0,0,'#ffe033',60,8);ctx.restore();
  ctx.save();ctx.translate(W/2,142);ctx.rotate(-.04);ctx.fillStyle=INK;ctx.fillRect(-128,-24,256,32);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-124,-21,248,26);ot('BLOODLINE',0,0,'#ff3a50',32,0);ctx.restore();
  star(530,70,34,22,10,tAll*.4,'#ffe033',INK,3);ot('GORE',530,68,'#d01028',16,3);ot('+ COOP',530,84,'#d01028',14,3);
  const bl=Math.floor(tAll*2)%2;
  ot('[ENTER] / CLIC  →  1 JUGADOR',W/2,196,bl?'#ffe033':'#fff',24,6);
  ot('[2]  →  CO-OP 2 JUGADORES',W/2,222,'#7ad8ff',18,5);
  box(W/2-228,244,456,56);ctx.fillStyle=INK;ctx.font=FNT(11);
  ctx.fillText('P1: WASD o FLECHAS + MOUSE (clic izq disparar · clic der / Q granada · E tanque)',W/2,261);
  ctx.fillText('P2: FLECHAS · . disparar · / granada · , tanque      G gore · M sonido · P pausa',W/2,277);
  ctx.fillText('Pistola · SMG · escopeta · lanzallamas · cohetes. ¡Rescata prisioneros y aplasta soldados con el tanque!',W/2,293);
  ctx.textAlign='left';
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){
    if(!paused){
      endT+=rdt;
      if(hitstop>0){hitstop-=rdt}
      else{let ts=1;if(slowT>0){ts=slowS;slowT-=rdt}update(rdt*ts)}
    }
  }else{tAll+=rdt;endT+=rdt;if(state==='over'||state==='win'){updParts(rdt)}}
  if(state==='title'){ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);drawTitle()}
  else draw();
  requestAnimationFrame(frame);
}
try{document.fonts.load('20px Bangers')}catch(e){}
resetWorld();players=[mkPlayer(0)];
window.__game={start:startGame,tp(y){camY=y;for(const p of players){p.y=y+200;p.hp=p.max=999}},get s(){return{state,score,kills,camY,players,enemies:enemies.length,parts:parts.length,gibs:gibs.length}}};
requestAnimationFrame(frame);
</script>
